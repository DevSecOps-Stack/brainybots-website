name: AI Pulse On-Demand Sync

# Manual trigger ONLY — zero scheduled runs, ₹0 spent when idle
on:
  workflow_dispatch:

concurrency:
  group: ai-pulse-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live fetch and Gemini brief synthesis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 fetch_pulse.py

      - name: Commit updated live pulse data
        run: |
          git config user.name "ai-pulse-bot"
          git config user.email "actions@github.com"
          git add data/daily_pulse.json data/pulse_data.js
          git diff --staged --quiet || git commit -m "chore: live AI Pulse sync"
          git push
